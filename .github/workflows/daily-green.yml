name: Daily Green Contribution

on:
  schedule:
    - cron: "17 13 * * *" # 13:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "${{ vars.CONTRIB_USER_NAME || github.repository_owner }}"
          git config user.email "${{ vars.CONTRIB_USER_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}"

      - name: Create 100 commits for today
        run: bash scripts/daily-commit.sh 100

      - name: Push commits
        run: git push
